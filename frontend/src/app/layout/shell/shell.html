<div class="shell" [class.abierto]="abierto()">
  <aside class="lateral">
    <div class="logo"><app-emoji nombre="copo" /> COLDWORK</div>
    <nav>
      @for (grupo of menu(); track grupo.titulo) {
        <div class="grupo">{{ grupo.titulo }}</div>
        @for (item of grupo.items; track item.ruta) {
          <a
            [routerLink]="item.ruta"
            routerLinkActive="activo"
            [routerLinkActiveOptions]="{ exact: item.ruta === '/' }"
            (click)="abierto.set(false)"
          >
            <i [class]="item.icono"></i> {{ item.etiqueta }}
          </a>
        }
      }
    </nav>
  </aside>

  <button type="button" class="fondo" aria-label="Cerrar menú" (click)="abierto.set(false)"></button>

  <div class="principal">
    <header class="barra">
      <p-button icon="pi pi-bars" [text]="true" class="solo-movil" (onClick)="abierto.set(true)" ariaLabel="Menú" />
      @if (empresa.actual(); as e) {
        <span class="empresa"><i class="pi pi-building"></i> {{ e.razonSocial }}</span>
      }
      @if (entorno !== 'prod') {
        <span class="entorno">{{ entorno }}</span>
      }
      <span class="espacio"></span>
      <!-- Cuenta: cambiar de empresa, crear empresa y cerrar sesión -->
      <app-menu-cuenta />
    </header>
    <main class="contenido"><router-outlet /></main>
  </div>
</div>
