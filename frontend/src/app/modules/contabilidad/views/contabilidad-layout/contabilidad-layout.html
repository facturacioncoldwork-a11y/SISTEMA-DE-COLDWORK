<div class="lg">
  <!-- ===== Encabezado del módulo (mismo diseño que Finanzas y Reportes) ===== -->
  <header class="lg-hero">
    <div class="lg-hero__fila">
      <div>
        <div class="lg-hero__miga"><i class="pi pi-book"></i> Contabilidad</div>
        <h1 class="lg-hero__titulo">Asientos y libros</h1>
        <p class="lg-hero__sub">Supervisa el trabajo contable, aprueba asientos y revisa los libros.</p>
      </div>
      <div class="periodo">
        <label for="conta-periodo">Periodo</label>
        <p-select
          inputId="conta-periodo"
          [options]="conta.periodos()"
          [ngModel]="conta.periodo()"
          (ngModelChange)="conta.periodo.set($event)"
        >
          <ng-template #selectedItem let-p>{{ p | periodo }}</ng-template>
          <ng-template #item let-p>{{ p | periodo }}</ng-template>
        </p-select>
      </div>
    </div>

    <nav class="lg-nav" aria-label="Secciones de contabilidad">
      @for (p of pestanas(); track p.ruta) {
        <a [routerLink]="p.ruta" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
          <i [class]="p.icono"></i> {{ p.etiqueta }}
          @if (p.conContador && conta.porAprobar().length) {
            <span class="lg-nav__badge">{{ conta.porAprobar().length }}</span>
          }
        </a>
      }
    </nav>
  </header>

  <div class="lg-cuerpo">
    <router-outlet />
  </div>
</div>
